<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>HSK Tone Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* Layout: a single study column, like one index card on a desk. Tone colours follow the common learner convention (1 red, 2 orange, 3 green, 4 blue). */
:root {
  --bg: #eef2f5; --surface: #ffffff; --ink: #14202a; --muted: #5a6a77; --line: #d6dee5; --soft: #e4eaef;
  --accent: #1d5c86; --accent-ink: #ffffff; --good: #1f7a45; --bad: #b3362f; --warn: #9a6a00;
  --t1: #cc3434; --t2: #d27a10; --t3: #2b8a4b; --t4: #2c63c7; --t5: #8a96a0;
  --f-han: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --f-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e141a; --surface: #161f28; --ink: #e5ecf2; --muted: #93a3b0; --line: #2a3642; --soft: #1d2833;
  --accent: #6cb0e2; --accent-ink: #0b1620; --good: #4fc27e; --bad: #f07a70; --warn: #e2b44a;
  --t1: #f06a6a; --t2: #f0a347; --t3: #5cc982; --t4: #6e9ff5; --t5: #8d99a3; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e141a; --surface: #161f28; --ink: #e5ecf2; --muted: #93a3b0; --line: #2a3642; --soft: #1d2833;
  --accent: #6cb0e2; --accent-ink: #0b1620; --good: #4fc27e; --bad: #f07a70; --warn: #e2b44a;
  --t1: #f06a6a; --t2: #f0a347; --t3: #5cc982; --t4: #6e9ff5; --t5: #8d99a3; color-scheme: dark }
* { box-sizing: border-box }
html, body { background: var(--bg); color: var(--ink) }
body { font-family: var(--f-body); font-size: 16px; line-height: 1.5; margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.2 }
h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em }
h2 { font-size: 1.05rem; font-weight: 600 }
.eyebrow { font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.muted { color: var(--muted) }
.small { font-size: .875rem }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0 }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap }
.spread { justify-content: space-between }
button { font: inherit; color: inherit; cursor: pointer }
button:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 16px; font-weight: 600 }
.btn:hover { border-color: var(--muted) }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); padding-inline: 8px }
.btn.ghost:hover { color: var(--ink) }
.btn.block { width: 100% }
.btn:disabled { opacity: .45; cursor: not-allowed }
.chips { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px }
.chip b { font-size: .95rem }
.chip span { font-size: .72rem; color: var(--muted) }
.chip[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--soft) }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 10px; overflow: hidden }
.seg button { border: 0; background: transparent; padding: 10px 6px; font-weight: 600; font-size: .88rem; border-left: 1px solid var(--line) }
.seg button:first-child { border-left: 0 }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink) }
select { font: inherit; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink) }
.field { display: flex; flex-direction: column; gap: 6px; flex: 1 1 140px; min-width: 0 }
.field label { font-size: .8rem; color: var(--muted); font-weight: 600 }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px }
.stat { display: flex; flex-direction: column; gap: 0 }
.stat b { font-family: var(--f-mono); font-size: 1.35rem; font-variant-numeric: tabular-nums }
.stat span { font-size: .78rem; color: var(--muted) }
.notice { border-left: 3px solid var(--warn); padding: 8px 12px; background: var(--soft); border-radius: 0 8px 8px 0; font-size: .88rem }
.notice.bad { border-color: var(--bad) }

/* study card */
.topbar { display: flex; align-items: center; gap: 12px }
.progress { flex: 1; height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .3s }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px 18px; display: flex; flex-direction: column; gap: 18px; min-width: 0 }
.prompt { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding-block: 8px }
.han { font-family: var(--f-han); font-weight: 500; font-size: clamp(3.6rem, 18vw, 6rem); line-height: 1.1; letter-spacing: .04em }
.han.sm { font-size: 2.6rem }
.eng { font-size: 1.45rem; font-weight: 600; line-height: 1.3; max-width: 30ch }
.pinyin { font-size: 1.35rem; font-weight: 500 }
.t1 { color: var(--t1) } .t2 { color: var(--t2) } .t3 { color: var(--t3) } .t4 { color: var(--t4) } .t5 { color: var(--t5) }
.step { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center }
.mic { width: 84px; height: 84px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; position: relative; transition: transform .15s }
.mic:hover { transform: scale(1.04) }
.mic svg { width: 34px; height: 34px }
.mic.live { background: var(--bad); color: #fff }
.mic.live::after { content: ""; position: absolute; inset: calc(-6px - var(--lvl, 0px)); border-radius: 50%; border: 3px solid var(--bad); opacity: .45; transition: inset .08s }
.interim { min-height: 1.5em; font-size: 1.05rem; color: var(--muted) }
.kbd { font-family: var(--f-mono); font-size: .75rem; border: 1px solid var(--line); border-radius: 5px; padding: 0 5px }
.result { border-top: 1px solid var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 12px }
.verdict { display: flex; align-items: center; gap: 8px; font-weight: 700 }
.verdict .dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; flex: none }
.ok { color: var(--good) } .no { color: var(--bad) } .unk { color: var(--warn) }
.sylls { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px }
.syl { border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.syl .head { display: flex; align-items: baseline; justify-content: space-between; gap: 6px }
.syl .head .p { font-size: 1.2rem; font-weight: 600 }
.syl .head .c { font-family: var(--f-han); font-size: 1.2rem }
.syl canvas { width: 100%; height: 64px; display: block }
.syl .line { font-size: .8rem; display: flex; flex-wrap: wrap; justify-content: space-between; column-gap: 6px }
.note { font-size: .82rem; color: var(--muted) }
.meanings { margin: 0; padding-left: 1.1em; font-size: .95rem }
.actions { display: flex; gap: 10px; flex-wrap: wrap }
.actions .btn { flex: 1 1 auto }
.missed { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none }
.missed li { display: flex; gap: 12px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--line) }
.missed li .h { font-family: var(--f-han); font-size: 1.3rem; min-width: 3.2em }
.cal-han { display: flex; gap: 18px; justify-content: center; font-family: var(--f-han); font-size: 2.6rem }
.cal-han span { display: flex; flex-direction: column; align-items: center; line-height: 1.1 }
.cal-han small { font-family: var(--f-body); font-size: 1rem; font-weight: 600 }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

<div class="wrap" id="app"></div>

<script>
// Tone engine: pitch tracking, syllable segmentation, tone classification,
// pinyin lookup and answer grading. Pure functions, no DOM.
const Engine = (() => {
  const SR = 16000, HOP = 160, WIN = 400, FMIN = 70, FMAX = 480;

  // ---------- audio -> pitch ----------
  function resample(x, from) {
    if (from === SR) return Float32Array.from(x);
    const ratio = from / SR, n = Math.floor(x.length / ratio), out = new Float32Array(n);
    const k = Math.max(1, Math.round(ratio));
    for (let i = 0; i < n; i++) {
      const c = Math.floor(i * ratio);
      let s = 0, m = 0;
      for (let j = c - (k >> 1); j <= c + (k >> 1); j++) if (j >= 0 && j < x.length) { s += x[j]; m++; }
      out[i] = m ? s / m : 0;
    }
    return out;
  }

  function yin(x, start, tauMin, tauMax) {
    const d = new Float32Array(tauMax + 1);
    for (let tau = 1; tau <= tauMax; tau++) {
      let s = 0;
      for (let j = 0; j < WIN; j++) { const v = x[start + j] - x[start + j + tau]; s += v * v; }
      d[tau] = s;
    }
    let run = 0, best = -1, bestV = 1e9;
    const c = new Float32Array(tauMax + 1); c[0] = 1;
    for (let tau = 1; tau <= tauMax; tau++) { run += d[tau]; c[tau] = run > 0 ? d[tau] * tau / run : 1; }
    for (let tau = tauMin; tau < tauMax; tau++) {
      if (c[tau] < 0.15) { while (tau + 1 < tauMax && c[tau + 1] < c[tau]) tau++; best = tau; bestV = c[tau]; break; }
      if (c[tau] < bestV) { bestV = c[tau]; best = tau; }
    }
    if (best <= 0) return { f0: 0, ap: 1 };
    let t = best;
    if (best > 1 && best < tauMax) {
      const a = c[best - 1], b = c[best], e = c[best + 1], den = a - 2 * b + e;
      if (den !== 0) t = best + 0.5 * (a - e) / den;
    }
    return { f0: SR / t, ap: bestV };
  }

  function median(a) { if (!a.length) return 0; const s = [...a].sort((p, q) => p - q); return s[s.length >> 1]; }
  function pct(a, p) { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y); return s[Math.min(s.length - 1, Math.floor(p * s.length))]; }

  function analyze(samples, sampleRate) {
    const x = resample(samples, sampleRate);
    const tauMin = Math.floor(SR / FMAX), tauMax = Math.ceil(SR / FMIN);
    const frames = Math.max(0, Math.floor((x.length - WIN - tauMax) / HOP));
    const f0 = new Float32Array(frames), ap = new Float32Array(frames), rms = new Float32Array(frames);
    for (let i = 0; i < frames; i++) {
      const st = i * HOP; let e = 0;
      for (let j = 0; j < WIN; j++) e += x[st + j] * x[st + j];
      rms[i] = Math.sqrt(e / WIN);
      if (rms[i] < 0.0015) { f0[i] = 0; ap[i] = 1; continue; }
      const r = yin(x, st, tauMin, tauMax); f0[i] = r.f0; ap[i] = r.ap;
    }
    const ra = Array.from(rms);
    const thr = Math.max(pct(ra, 0.1) * 2.5, pct(ra, 0.98) * 0.07, 0.003);
    const voiced = new Uint8Array(frames);
    for (let i = 0; i < frames; i++) voiced[i] = rms[i] > thr && ap[i] < 0.3 && f0[i] >= FMIN && f0[i] <= FMAX ? 1 : 0;
    const vals = []; for (let i = 0; i < frames; i++) if (voiced[i]) vals.push(f0[i]);
    const med = median(vals);
    // octave error repair
    for (let i = 0; i < frames; i++) if (voiced[i]) {
      if (f0[i] > med * 1.8) f0[i] /= 2; else if (f0[i] < med * 0.56) f0[i] *= 2;
    }
    // median filter over voiced neighbours
    const sm = Float32Array.from(f0);
    for (let i = 0; i < frames; i++) if (voiced[i]) {
      const w = []; for (let j = i - 2; j <= i + 2; j++) if (j >= 0 && j < frames && voiced[j]) w.push(f0[j]);
      sm[i] = median(w);
    }
    // bridge 1-frame gaps
    for (let i = 1; i < frames - 1; i++) if (!voiced[i] && voiced[i - 1] && voiced[i + 1] && Math.abs(sm[i - 1] - sm[i + 1]) / sm[i - 1] < 0.12) { voiced[i] = 1; sm[i] = (sm[i - 1] + sm[i + 1]) / 2; }
    let runs = [], a = -1;
    for (let i = 0; i <= frames; i++) {
      if (i < frames && voiced[i]) { if (a < 0) a = i; }
      else if (a >= 0) { if (i - a >= 5) runs.push([a, i - 1]); a = -1; }
    }
    return { f0: sm, rms, voiced, runs, median: med, frames };
  }

  function runEnergy(an, r) { let s = 0; for (let i = r[0]; i <= r[1]; i++) s += an.rms[i]; return s; }

  function segment(an, n) {
    let runs = an.runs.map(r => r.slice());
    if (!runs.length || n < 1) return new Array(n).fill(null);
    while (runs.length > n) {
      const en = runs.map(r => runEnergy(an, r)), medE = median(en);
      let wi = 0; en.forEach((e, i) => { if (e < en[wi]) wi = i; });
      const len = runs[wi][1] - runs[wi][0] + 1;
      if (len < 9 && en[wi] < medE * 0.3) { runs.splice(wi, 1); continue; }
      let gi = 0, g = 1e9;
      for (let i = 0; i < runs.length - 1; i++) { const gap = runs[i + 1][0] - runs[i][1]; if (gap < g) { g = gap; gi = i; } }
      runs.splice(gi, 2, [runs[gi][0], runs[gi + 1][1]]);
    }
    while (runs.length < n) {
      let li = 0; runs.forEach((r, i) => { if (r[1] - r[0] > runs[li][1] - runs[li][0]) li = i; });
      const [a, b] = runs[li], len = b - a + 1, parts = n - runs.length + 1;
      if (len < 16) break;
      // deepest smoothed-energy valley in the middle of the run
      const lo = a + Math.floor(len * (parts > 2 ? 0.15 : 0.22)), hi = b - Math.floor(len * (parts > 2 ? 0.15 : 0.22));
      let p = -1, pv = 1e9;
      for (let i = lo; i <= hi; i++) {
        let s = 0, m = 0; for (let j = i - 2; j <= i + 2; j++) if (j >= a && j <= b) { s += an.rms[j]; m++; }
        // also favour pitch discontinuities
        const jump = i > a ? Math.abs(Math.log2(an.f0[i] / an.f0[i - 1])) * 12 : 0;
        const v = s / m - jump * 0.002;
        if (v < pv) { pv = v; p = i; }
      }
      if (parts > 2) { // even split when many syllables share one run and no clear valley
        const peak = Math.max(...Array.from(an.rms.slice(a, b + 1)));
        if (pv > peak * 0.75) p = a + Math.floor(len / parts);
      }
      runs.splice(li, 1, [a, p - 1], [p + 1, b]);
    }
    const out = runs.slice(0, n);
    while (out.length < n) out.push(null);
    return out;
  }

  function features(an, seg, baseHz) {
    if (!seg) return null;
    const [a, b] = seg, raw = [];
    for (let i = a; i <= b; i++) if (an.voiced[i] && an.f0[i] > 0) raw.push(12 * Math.log2(an.f0[i] / baseHz));
    const trim = Math.max(1, Math.floor(raw.length * 0.1));
    const v = raw.slice(trim, raw.length - trim);
    if (v.length < 4) return null;
    const s = v.map((_, i) => { let t = 0, m = 0; for (let j = i - 1; j <= i + 1; j++) if (j >= 0 && j < v.length) { t += v[j]; m++; } return t / m; });
    const n = s.length, q = Math.max(1, Math.round(n * 0.25));
    const avg = arr => arr.reduce((p, c) => p + c, 0) / arr.length;
    const start = avg(s.slice(0, q)), end = avg(s.slice(n - q));
    let mi = 0, ma = 0; s.forEach((x, i) => { if (x < s[mi]) mi = i; if (x > s[ma]) ma = i; });
    const pts = []; for (let k = 0; k < 24; k++) pts.push(s[Math.round(k * (n - 1) / 23)]);
    return { start, end, min: s[mi], max: s[ma], minPos: mi / (n - 1), maxPos: ma / (n - 1), mean: avg(s), dur: (b - a + 1) * HOP / SR, pts };
  }

  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  // f values are semitones relative to the speaker's baseline; scale maps the
  // speaker's span onto a standard 8-semitone span (Chao 1 to 5).
  function classify(f, scale = 1) {
    if (!f) return null;
    const k = 1 / scale;
    const start = f.start * k, end = f.end * k, mn = f.min * k, mx = f.max * k, lvl = f.mean * k;
    const d = end - start, dip = Math.min(start, end) - mn, rng = mx - mn;
    const midMin = f.minPos > 0.22 && f.minPos < 0.88;
    const s = [
      2 - 1.4 * Math.max(0, Math.abs(d) - 1.2) - 0.5 * Math.max(0, rng - 3) + 0.4 * clamp(lvl, -4, 4),
      1.1 * (d - 1.2) + (f.minPos < 0.45 ? 0.5 : -0.5) - 0.4 * Math.max(0, dip - 2.5),
      0.6 * dip + 0.5 * clamp(-lvl, -4, 6) + (midMin ? 0.6 : -0.3) + 0.25 * clamp(-end, -2, 6) - 0.4 * Math.max(0, start - 2),
      0.9 * (-d - 2.5) + 0.3 * clamp(start, -3, 5) - (start < -1 ? 1 : 0) - 0.3 * Math.max(0, dip - 1.5)
    ];
    const ex = s.map(v => Math.exp(v)), z = ex.reduce((p, c) => p + c, 0);
    const probs = ex.map(v => v / z);
    let t = 0; probs.forEach((p, i) => { if (p > probs[t]) t = i; });
    return { tone: t + 1, conf: probs[t], probs, scores: s };
  }

  // ---------- pinyin ----------
  let DICT = {}, MAXW = 4;
  const OVERRIDE = { '吗': 'ma5', '儿': 'er2', '呢': 'ne5', '吧': 'ba5', '啊': 'a5', '的': 'de5', '了': 'le5', '着': 'zhe5', '么': 'me5' };
  function setDict(d) { DICT = d; MAXW = 4; }
  const DIGITS = { '0': '零', '1': '一', '2': '二', '3': '三', '4': '四', '5': '五', '6': '六', '7': '七', '8': '八', '9': '九', '10': '十', '两': '两' };
  function cleanZh(t) {
    t = (t || '').replace(/10/g, '十').replace(/[0-9]/g, m => DIGITS[m]);
    return t.replace(/[^\u3400-\u9fff]/g, '');
  }
  function normSyl(s) { return s.toLowerCase().replace(/ü|u:/g, 'v'); }
  function splitNum(s) { s = normSyl(s); const m = s.match(/^([a-zv]+?)([0-5])?$/); return m ? { syl: m[1], tone: m[2] ? +m[2] : 5 } : { syl: s, tone: 5 }; }
  function toPinyin(text) {
    const out = [];
    let i = 0;
    while (i < text.length) {
      let hit = null;
      for (let L = Math.min(MAXW, text.length - i); L >= 1; L--) {
        const w = text.substr(i, L);
        const p = L === 1 && OVERRIDE[w] ? OVERRIDE[w] : DICT[w];
        if (p) { hit = { w, p: p.split(' ') }; break; }
      }
      if (hit) {
        [...hit.w].forEach((ch, j) => { const sp = splitNum(hit.p[j] || ''); out.push({ ch, syl: sp.syl, tone: sp.tone }); });
        i += hit.w.length;
      } else { out.push({ ch: text[i], syl: null, tone: 0 }); i++; }
    }
    // erhua: r5 attaches to previous syllable
    const merged = [];
    out.forEach(o => { if (o.syl === 'r' && merged.length) { merged[merged.length - 1].syl += 'r'; merged[merged.length - 1].ch += o.ch; } else merged.push(o); });
    return merged;
  }

  const MARKS = { a: 'āáǎà', e: 'ēéěè', i: 'īíǐì', o: 'ōóǒò', u: 'ūúǔù', v: 'ǖǘǚǜ' };
  function mark(syl, tone) {
    if (!syl) return '?';
    let s = syl;
    if (tone >= 1 && tone <= 4) {
      let idx = s.indexOf('a'); if (idx < 0) idx = s.indexOf('e');
      if (idx < 0 && s.includes('ou')) idx = s.indexOf('o');
      if (idx < 0) for (let j = s.length - 1; j >= 0; j--) if ('aeiouv'.includes(s[j])) { idx = j; break; }
      if (idx >= 0) s = s.slice(0, idx) + MARKS[s[idx]][tone - 1] + s.slice(idx + 1);
    }
    return s.replace(/v/g, 'ü');
  }

  function expected(word) {
    // word: [hanzi, pinyinMarked, numeric, meanings, level]

// ---------- storage ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('hsk-tone:' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('hsk-tone:' + k, JSON.stringify(v)); } catch (e) {} }
};
let SRS = store.get('srs', {});
let SET = Object.assign({ levels: [1], mode: 'c', size: 20, fresh: 10 }, store.get('settings', {}));
let VOICE = store.get('voice', null); // {base, scale, calibrated}

const DAY = 86400e3;
const now = () => Date.now();
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = s => document.querySelector(s);
const app = $('#app');
const SRc = window.SpeechRecognition || window.webkitSpeechRecognition;
const TONE_NAME = { 1: '1st (high level)', 2: '2nd (rising)', 3: '3rd (low dipping)', 4: '4th (falling)', 5: 'neutral' };
const ORD = { 1: '1st', 2: '2nd', 3: '3rd', 4: '4th', 5: 'neutral' };

function srsUpdate(id, good) {
  const s = SRS[id] || { n: 0, ivl: 0, ef: 2.4, due: 0, lapses: 0 };
  if (good) {
    s.n++; s.ivl = s.n === 1 ? 1 : s.n === 2 ? 3 : Math.round(s.ivl * s.ef);
    s.ef = Math.min(3, s.ef + 0.05); s.due = now() + s.ivl * DAY - 3 * 3600e3;
  } else {
    s.n = 0; s.ivl = 0; s.ef = Math.max(1.3, s.ef - 0.2); s.lapses++; s.due = now() + 10 * 60e3;
  }
  SRS[id] = s; store.set('srs', SRS);
}

function deckItems() {
  const dirs = SET.mode === 'mix' ? ['c', 'e'] : [SET.mode];
  const items = [];
  HSK.forEach((w, i) => { if (SET.levels.includes(w[4])) dirs.forEach(d => items.push({ i, d, id: w[0] + '|' + d })); });
  return items;
}
function counts() {
  const items = deckItems(), t = now();
  const due = items.filter(x => SRS[x.id] && SRS[x.id].due <= t).length;
  const fresh = items.filter(x => !SRS[x.id]).length;
  return { due, fresh, total: items.length };
}
function levelLearned(l) {
  let n = 0, tot = 0;
  HSK.forEach(w => { if (w[4] === l) { tot++; if ((SRS[w[0] + '|c'] || {}).n > 0 || (SRS[w[0] + '|e'] || {}).n > 0) n++; } });
  return { n, tot };
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function buildSession() {
  const items = deckItems(), t = now();
  const due = items.filter(x => SRS[x.id] && SRS[x.id].due <= t).sort((a, b) => SRS[a.id].due - SRS[b.id].due);
  let fresh = items.filter(x => !SRS[x.id]);
  if (SET.mode === 'mix') { // introduce each new word character-first; its English-first card follows next session
    const seen = new Set(); fresh = fresh.filter(x => { if (seen.has(x.i)) return false; seen.add(x.i); return true; });
  }
  const q = due.slice(0, SET.size);
  const room = Math.max(0, Math.min(SET.fresh, SET.size - q.length));
  return shuffle(q.concat(fresh.slice(0, room)));
}

// ---------- audio ----------
const AU = { ctx: null, stream: null, rec: false, chunks: [], level: 0, ok: false, disabled: false, onLevel: null };
async function ensureMic() {
  if (AU.disabled) return false;
  if (AU.stream) { if (AU.ctx.state !== 'running') await AU.ctx.resume(); return true; }
  try {
    AU.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    AU.ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = AU.ctx.createMediaStreamSource(AU.stream);
    const node = AU.ctx.createScriptProcessor(2048, 1, 1);
    node.onaudioprocess = e => {
      const d = e.inputBuffer.getChannelData(0); let s = 0;
      for (let i = 0; i < d.length; i += 4) s += d[i] * d[i];
      AU.level = Math.sqrt(s / (d.length / 4));
      if (AU.rec) AU.chunks.push(new Float32Array(d));
      if (AU.onLevel) AU.onLevel(AU.level);
    };
    src.connect(node); node.connect(AU.ctx.destination);
    AU.node = node; AU.ok = true;
    if (AU.ctx.state !== 'running') await AU.ctx.resume();
    return true;
  } catch (e) { AU.disabled = true; return false; }
}
function releaseMic() { if (AU.stream) AU.stream.getTracks().forEach(t => t.stop()); AU.stream = null; AU.ok = false; }
function takeSamples() {
  const n = AU.chunks.reduce((p, c) => p + c.length, 0), out = new Float32Array(n);
  let o = 0; AU.chunks.forEach(c => { out.set(c, o); o += c.length; }); AU.chunks = [];
  return out;
}

let active = null; // current listening session {stop()}
function setLive(on) {
  const b = $('#mic'); if (!b) return;
  b.classList.toggle('live', on);
  b.setAttribute('aria-label', on ? 'Stop listening' : 'Start speaking');
  AU.onLevel = on ? lv => { b.style.setProperty('--lvl', Math.min(14, lv * 160) + 'px'); } : null;
}

// Speech recognition plus optional pitch capture.
function listen(lang, pitch, onInterim) {
  return new Promise(async resolve => {
    const usePitch = pitch && await ensureMic();
    if (usePitch) { AU.chunks = []; AU.rec = true; }
    if (!SRc) { resolve({ alts: [], err: 'unsupported' }); return; }
    const rec = new SRc();
    rec.lang = lang; rec.interimResults = true; rec.maxAlternatives = 5; rec.continuous = false;
    let alts = [], err = null, finished = false;
    const finish = () => {
      if (finished) return; finished = true; clearTimeout(cap);
      setTimeout(() => {
        AU.rec = false; active = null; setLive(false);
        const samples = usePitch ? takeSamples() : null;
        resolve({ alts, err, samples, sr: usePitch ? AU.ctx.sampleRate : 0 });
      }, 150);
    };
    rec.onresult = e => {
      let interim = '';
      for (let i = 0; i < e.results.length; i++) interim += e.results[i][0].transcript;
      onInterim && onInterim(interim);
      const finals = Array.from(e.results).filter(r => r.isFinal);
      if (finals.length) {
        const first = finals[0];
        alts = Array.from(first).map(a => ({ text: a.transcript, conf: a.confidence }));
        if (finals.length > 1) alts.unshift({ text: finals.map(r => r[0].transcript).join(''), conf: 0 });
      }
    };
    rec.onerror = e => { err = e.error; };
    rec.onend = finish;
    const cap = setTimeout(() => { try { rec.stop(); } catch (e) {} }, 8000);
    active = { stop: () => { try { rec.stop(); } catch (e) { finish(); } } };
    setLive(true);
    try { rec.start(); } catch (e) { err = 'start'; finish(); }
  });
}

// Pitch-only recorder with silence auto-stop (used for calibration).
function recordPitch(maxMs = 7000, silenceMs = 1600) {
  return new Promise(async resolve => {
    if (!(await ensureMic())) { resolve(null); return; }
    AU.chunks = []; AU.rec = true;
    let heard = false, quiet = 0, t0 = now(), done = false;
    const stop = () => { if (done) return; done = true; clearInterval(iv); AU.rec = false; active = null; setLive(false); resolve({ samples: takeSamples(), sr: AU.ctx.sampleRate }); };
    const noise = [];
    const iv = setInterval(() => {
      const lv = AU.level;
      if (now() - t0 < 300) { noise.push(lv); return; }
      const floor = Math.max(0.004, (noise.reduce((a, b) => a + b, 0) / (noise.length || 1)) * 3);
      if (lv > floor) { heard = true; quiet = 0; } else if (heard) quiet += 50;
      if ((heard && quiet > silenceMs) || now() - t0 > maxMs) stop();
    }, 50);
    active = { stop };
    setLive(true);
  });
}

function pitchFeatures(samples, sr, n) {
  if (!samples || samples.length < sr * 0.2) return null;
  const an = Engine.analyze(samples, sr);
  if (!an.runs.length) return null;
  let base = VOICE && VOICE.base;
  if (!base) { base = an.median; }
  if (!VOICE || !VOICE.calibrated) { // keep a running estimate of the speaker's middle pitch
    const prev = VOICE && VOICE.base ? VOICE.base : an.median;
    VOICE = { base: Math.exp(0.85 * Math.log(prev) + 0.15 * Math.log(an.median)), scale: 1, calibrated: false };
    store.set('voice', VOICE);
  }
  const segs = Engine.segment(an, n);
  return segs.map(s => Engine.features(an, s, base));
}

function speak(text) {
  try {
    const synth = window.speechSynthesis; if (!synth) return;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; u.rate = 0.8;
    const v = synth.getVoices().find(v => /zh[-_]CN/i.test(v.lang)) || synth.getVoices().find(v => /^zh/i.test(v.lang));
    if (v) u.voice = v;
    synth.speak(u);
  } catch (e) {}
}
if (window.speechSynthesis) window.speechSynthesis.onvoiceschanged = () => {};

// ---------- drawing ----------
const CHAO = { 1: [5, 5], 2: [3, 5], 3: [2, 1, 4], 4: [5, 1] };
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function drawContour(cv, tone, f, scale) {
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth || 120, h = cv.clientHeight || 64;
  cv.width = w * dpr; cv.height = h * dpr;
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  const lim = 7 * (scale || 1), y = st => h - 6 - (Math.max(-lim, Math.min(lim, st)) + lim) / (2 * lim) * (h - 12);
  g.strokeStyle = cssVar('--line'); g.lineWidth = 1;
  for (let l = 1; l <= 5; l++) { const yy = y((l - 3) * 2 * (scale || 1)); g.beginPath(); g.moveTo(0, yy); g.lineTo(w, yy); g.stroke(); }
  if (CHAO[tone]) {
    const pts = CHAO[tone].map(l => (l - 3) * 2 * (scale || 1));
    g.setLineDash([5, 4]); g.lineWidth = 3; g.strokeStyle = cssVar('--t' + tone); g.globalAlpha = 0.55; g.beginPath();
    for (let k = 0; k <= 30; k++) { const u = k / 30, s = u * (pts.length - 1), a = Math.floor(s), fr = s - a; const v = pts[Math.min(a, pts.length - 1)] * (1 - fr) + pts[Math.min(a + 1, pts.length - 1)] * fr; const x = 6 + u * (w - 12); k ? g.lineTo(x, y(v)) : g.moveTo(x, y(v)); }
    g.stroke(); g.setLineDash([]); g.globalAlpha = 1;
  }
  if (f) {
    g.lineWidth = 2.5; g.strokeStyle = cssVar('--ink'); g.lineJoin = 'round'; g.beginPath();
    f.pts.forEach((v, k) => { const x = 6 + k / (f.pts.length - 1) * (w - 12); k ? g.lineTo(x, y(v)) : g.moveTo(x, y(v)); });
    g.stroke();
  }
}

const MIC_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/><path d="M8 21h8"/></svg>';
const SPEAK_SVG = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';

function coloredHan(w) {
  const tones = w[2].split(' ').map(s => +(s.match(/[0-5]$/) || [5])[0]);
  return [...w[0]].map((c, i) => `<span class="t${tones[i] || 5}">${esc(c)}</span>`).join('');
}
function coloredPinyin(w) {
  const tones = w[2].split(' ').map(s => +(s.match(/[0-5]$/) || [5])[0]);
  return w[1].split(' ').map((p, i) => `<span class="t${tones[i] || 5}">${esc(p)}</span>`).join(' ');
}

  <section class="panel" aria-label="Deck">
    <div class="row spread"><h2>Levels</h2><span class="small muted">learned / words</span></div>

    <p class="small muted" style="margin:0">${SET.mode === 'c' ? 'See the character, say it in Mandarin, then say the English.' : SET.mode === 'e' ? 'See the English, say the word in Mandarin.' : 'New words start character-first; both directions come up in review.'}</p>
    <div class="row">

      <div class="field"><label for="fresh">New words per session</label><select id="fresh">${[0, 5, 10, 20].map(n => `<option ${n === SET.fresh ? 'selected' : ''}>${n}</option>`).join('')}</select></div>

    <p class="small muted" style="margin:0">Tone checking reads the pitch of your voice. A 10-second calibration (say mā má mǎ mà) teaches it your natural range, which makes single-syllable words much more reliable.</p>
    <button class="btn" id="cal">${VOICE && VOICE.calibrated ? 'Recalibrate' : 'Calibrate my voice'}</button>
  </section>

  app.querySelectorAll('.chip').forEach(b => b.onclick = () => {

// calibration
async function calibrate() {
  app.innerHTML = `
  <div class="topbar"><button class="btn ghost" id="back">← Back</button></div>
  <section class="card">
    <div class="prompt">
      <div class="eyebrow">Calibration</div>
      <div class="cal-han"><span class="t1">妈<small>mā</small></span><span class="t2">麻<small>má</small></span><span class="t3">马<small>mǎ</small></span><span class="t4">骂<small>mà</small></span></div>
      <p class="muted small" style="margin:0;max-width:38ch">Tap the mic, then say the four syllables slowly in your normal voice, with a short pause between each. It stops on its own.</p>
    </div>
    <div class="step"><button class="mic" id="mic" aria-label="Start speaking">${MIC_SVG}</button><div class="interim" id="interim"></div></div>
    <div id="calres"></div>
  </section>`;
  $('#back').onclick = () => { if (active) active.stop(); home(); };
  $('#mic').onclick = async () => {
    if (active) { active.stop(); return; }
    $('#interim').textContent = 'Listening…';
    const r = await recordPitch(9000, 1500);
    $('#interim').textContent = '';
    if (!r) { $('#calres').innerHTML = `<div class="notice bad">Microphone access was refused. Allow the microphone for this page in your browser's site settings, then try again.</div>`; return; }
    const an = Engine.analyze(r.samples, r.sr);
    const segs = Engine.segment(an, 4);
    if (an.runs.length < 2 || segs.some(s => !s)) { $('#calres').innerHTML = `<div class="notice">I couldn't find four clear syllables. Try again a little louder, with a pause between each.</div>`; return; }
    const tmp = segs.map(s => Engine.features(an, s, an.median));
    if (tmp.some(f => !f)) { $('#calres').innerHTML = `<div class="notice">Some syllables were too short to read. Try again, a bit slower.</div>`; return; }
    const hi = tmp[0].mean, lo = Math.min(tmp[2].min, tmp[3].end);
    const span = Math.max(3, hi - lo);
    const mid = an.median * Math.pow(2, ((hi + lo) / 2) / 12);
    const scale = Math.max(0.5, Math.min(2, span / 8));
    const feats = segs.map(s => Engine.features(an, s, mid));
    const cls = feats.map(f => Engine.classify(f, scale));
    const hits = cls.filter((c, i) => c && c.tone === i + 1).length;
    $('#calres').innerHTML = `
      <div class="result">
        <div class="verdict ${hits === 4 ? 'ok' : 'unk'}"><span class="dot"></span>${hits}/4 tones read as intended</div>
        <div class="sylls">${['mā', 'má', 'mǎ', 'mà'].map((p, i) => `<div class="syl"><div class="head"><span class="p t${i + 1}">${p}</span><span class="small ${cls[i] && cls[i].tone === i + 1 ? 'ok' : 'no'}">${cls[i] ? 'read as ' + ORD[cls[i].tone] : '—'}</span></div><canvas id="cc${i}"></canvas></div>`).join('')}</div>
        <p class="note" style="margin:0">Middle of your range: ${Math.round(mid)} Hz. Span from 1st-tone level to 3rd-tone low: ${span.toFixed(1)} semitones.${hits < 4 ? ' If a tone was misread, exaggerate it a little and calibrate again.' : ''}</p>
        <div class="actions"><button class="btn" id="again">Try again</button><button class="btn primary" id="save">Save calibration</button></div>
      </div>`;
    feats.forEach((f, i) => drawContour($('#cc' + i), i + 1, f, scale));
    $('#again').onclick = calibrate;
    $('#save').onclick = () => { VOICE = { base: mid, scale, calibrated: true }; store.set('voice', VOICE); home(); };
  };
}

// session
let S = null;
function startSession() {
  const q = buildSession();
  if (!q.length) return;
  S = { q, pos: 0, done: 0, right: 0, toneOk: 0, toneTot: 0, missed: [], requeued: new Set() };
  showCard();
}

function showCard() {
  if (S.pos >= S.q.length) { summary(); return; }
  const it = S.q[S.pos], w = HSK[it.i];
  const E = Engine.expected(w);
  S.cur = { it, w, E, zh: null, en: null, override: null };
  const prompt = it.d === 'c'
    ? `<div class="han" lang="zh-CN">${esc(w[0])}</div>`
    : `<div class="eng">${esc(w[3].slice(0, 3).join(' · '))}</div><div class="small muted">${E.length} syllable${E.length > 1 ? 's' : ''}</div>`;
  app.innerHTML = `
  <div class="topbar"><button class="btn ghost" id="quit">✕ End</button><div class="progress" aria-hidden="true"><i style="width:${S.pos / S.q.length * 100}%"></i></div><span class="mono small muted">${S.pos + 1}/${S.q.length}</span></div>
  <section class="card" aria-live="polite">
    <div class="prompt"><div class="eyebrow">HSK ${w[4]}${SRS[it.id] ? '' : ' · new word'}</div>${prompt}</div>
    <div id="stage"></div>
  </section>`;
  $('#quit').onclick = () => { if (active) active.stop(); summary(); };
  stepMandarin();
}

function micStep(label, hint) {
  $('#stage').innerHTML = `
    <div class="step">
      <div class="eyebrow">${label}</div>
      <button class="mic" id="mic" aria-label="Start speaking">${MIC_SVG}</button>
      <div class="interim" id="interim">${hint}</div>
      <button class="btn ghost small" id="reveal">I don't know, show me</button>
    </div>`;
}

function stepMandarin() {
  const { w } = S.cur;
  micStep('Say it in Mandarin', `Tap the mic or press <span class="kbd">Space</span>`);
  $('#reveal').onclick = () => { S.cur.zh = { gave: true }; S.cur.en = { gave: true }; renderResult(); };
  $('#mic').onclick = async () => {
    if (active) { active.stop(); return; }
    $('#interim').textContent = 'Listening…';
    let r = await listen('zh-CN', true, t => { const el = $('#interim'); if (el) el.textContent = t || 'Listening…'; });
    if (r.err && /audio-capture|not-allowed|service-not-allowed/.test(r.err) && AU.stream) {
      // some phones can't share the mic between pitch capture and recognition
      releaseMic(); AU.disabled = true; S.pitchOff = true;
      $('#interim').textContent = 'Listening again (tone tracking unavailable on this device)…';
      r = await listen('zh-CN', false, t => { const el = $('#interim'); if (el) el.textContent = t || 'Listening…'; });
    }
    if (!$('#stage')) return;
    if (r.err === 'not-allowed' || r.err === 'service-not-allowed') { $('#interim').innerHTML = `<span class="no">Microphone or speech service blocked. Allow the microphone for this page and reload.</span>`; return; }
    if (!r.alts.length) { $('#interim').innerHTML = `<span class="unk">Didn't catch that${r.err && r.err !== 'no-speech' ? ' (' + esc(r.err) + ')' : ''}. Tap and try again.</span>`; return; }
    const feats = r.samples ? pitchFeatures(r.samples, r.sr, S.cur.E.length) : null;
    S.cur.zh = Engine.gradeMandarin(w, r.alts, feats, VOICE ? VOICE.scale : 1);
    S.cur.zh.pitchMissing = !feats;
    if (S.cur.it.d === 'e') { // accept a different HSK word with the same meaning
      const alt = !S.cur.zh.exact && altWord(S.cur.zh.heardText, w);
      if (alt) S.cur.zh.altWord = alt;
    }
    renderResult();
  };
}

function altWord(text, w) {
  const t = Engine.cleanZh(text); if (!t) return null;
  const hit = HSK.find(x => x[0] === t && x[0] !== w[0]);
  if (!hit) return null;
  const g = Engine.gradeEnglish(w[3], hit[3].map(m => ({ text: m })));
  return g.ok ? hit : null;
}

function stepEnglish() {
  const box = document.createElement('div'); box.id = 'enstep'; box.className = 'result';
  box.innerHTML = `<div class="step"><div class="eyebrow">Now say the English</div><button class="mic" id="mic" aria-label="Start speaking">${MIC_SVG}</button><div class="interim" id="interim">Tap the mic or press <span class="kbd">Space</span></div><button class="btn ghost small" id="reveal">I don't know the meaning</button></div>`;
  $('#stage').appendChild(box);
  $('#reveal').onclick = () => { S.cur.en = { gave: true }; renderResult(); };
  $('#mic').onclick = async () => {
    if (active) { active.stop(); return; }
    $('#interim').textContent = 'Listening…';
    const r = await listen(navigator.language && navigator.language.startsWith('en') ? navigator.language : 'en-AU', false, t => { const el = $('#interim'); if (el) el.textContent = t || 'Listening…'; });
    if (!$('#stage')) return;
    if (!r.alts.length) { $('#interim').innerHTML = `<span class="unk">Didn't catch that. Tap and try again.</span>`; return; }
    S.cur.en = Engine.gradeEnglish(S.cur.w[3], r.alts);
    renderResult();
  };
  $('#mic').focus();
}

function verdictOf(cur) {
  const zh = cur.zh || {}, en = cur.en;
  const reasons = [];
  if (zh.gave) reasons.push('answer revealed');
  else {
    if (!zh.pinyinOk && !zh.altWord) reasons.push('pronunciation');
    if (zh.tones === 'wrong') reasons.push('tones');
  }
  if (cur.it.d === 'c' && en && !zh.gave) { if (en.gave) reasons.push('meaning revealed'); else if (!en.ok) reasons.push('meaning'); }
  const auto = reasons.length === 0;
  return { good: cur.override === null ? auto : cur.override, auto, reasons };
}

function sylHtml(r, i) {
  const e = r.exp, t = e.surf;
  const heard = r.heard ? Engine.mark(r.heard.syl, 0) : '—';
  let toneLine = '';
  if (t === 5) toneLine = `<span class="muted">neutral, not graded</span>`;
  else if (!r.pitch) toneLine = `<span class="muted">no pitch reading</span>`;
  else {
    const c = r.pitch.c, cls = r.toneState === 'ok' ? 'ok' : r.toneState === 'wrong' ? 'no' : 'unk';
    toneLine = `<span class="${cls}">${r.toneState === 'unsure' ? 'unclear, maybe ' + ORD[c.tone] : 'you: ' + ORD[c.tone]}</span>`;
  }
  return `<div class="syl">
    <div class="head"><span class="p t${t}">${esc(Engine.mark(e.syl, t))}</span><span class="c t${e.tone}" lang="zh-CN">${esc(e.ch)}</span></div>
    <canvas id="cv${i}" aria-label="Pitch contour"></canvas>
    <div class="line"><span class="muted">heard</span><span class="${r.sylOk ? 'ok' : 'no'}">${esc(heard)} ${r.sylOk ? '✓' : '✗'}</span></div>
    <div class="line"><span class="muted">tone ${ORD[t]}</span>${toneLine}</div>
  </div>`;
}

function renderResult() {
  const cur = S.cur, { w, it } = cur, zh = cur.zh;
  const needEn = it.d === 'c' && !cur.en && !zh.gave;
  let html = `<div class="result">
    <div class="row spread"><div><div class="han sm" lang="zh-CN">${coloredHan(w)}</div><div class="pinyin">${coloredPinyin(w)}</div></div>
    <button class="btn" id="say" aria-label="Hear it">${SPEAK_SVG}</button></div>`;
  if (!zh.gave) {
    const pv = zh.pinyinOk ? 'ok' : zh.altWord ? 'unk' : 'no';
    html += `<div class="verdict ${pv}"><span class="dot"></span>${zh.pinyinOk ? 'Pronunciation right' : zh.altWord ? 'Also correct: ' + esc(zh.altWord[0]) + ' ' + esc(zh.altWord[1]) + ', but this card wants ' + esc(w[0]) : 'Heard: ' + esc(zh.heardText || 'nothing')}</div>`;
    if (!zh.altWord) {
      html += `<div class="sylls">${zh.rows.map(sylHtml).join('')}</div>`;
      const tv = zh.tones === 'ok' ? ['ok', 'Tones right'] : zh.tones === 'wrong' ? ['no', 'Tone needs work'] : ['unk', zh.pitchMissing ? 'Tones not checked (no clear pitch reading)' : 'Tones unclear'];
      html += `<div class="verdict ${tv[0]}"><span class="dot"></span>${tv[1]}</div>`;
      const notes = zh.rows.filter(r => r.exp.note).map(r => r.exp.note);
      if (notes.length) html += `<p class="note" style="margin:0">Tone change: ${esc([...new Set(notes)].join('; '))}.</p>`;
      if (zh.rows.some(r => r.toneState === 'wrong')) html += `<p class="note" style="margin:0">Dashed line: the target tone shape. Solid line: your voice.</p>`;
    }
  }
  if (it.d === 'c' && cur.en && !zh.gave) {
    html += cur.en.gave ? `<div class="verdict no"><span class="dot"></span>Meaning revealed</div>`
      : `<div class="verdict ${cur.en.ok ? 'ok' : 'no'}"><span class="dot"></span>${cur.en.ok ? 'Meaning right' : 'Meaning: heard “' + esc(cur.en.heard) + '”'}</div>`;
  }
  if (!needEn) html += `<ul class="meanings">${w[3].map(m => `<li>${esc(m)}</li>`).join('')}</ul>`;
  html += `</div>`;
  $('#stage').innerHTML = html;
  $('#say').onclick = () => speak(w[0]);
  if (!zh.gave && !zh.altWord) zh.rows.forEach((r, i) => drawContour($('#cv' + i), r.exp.surf, r.pitch && r.pitch.f, VOICE ? VOICE.scale : 1));
  if (needEn) { stepEnglish(); return; }
  if (zh.gave || zh.pinyinOk === false || zh.tones === 'wrong') speak(w[0]);
  renderVerdict();
}

function renderVerdict() {
  const cur = S.cur, v = verdictOf(cur);
  const box = document.createElement('div'); box.className = 'result';
  box.innerHTML = `
    <div class="verdict ${v.good ? 'ok' : 'no'}" style="font-size:1.1rem"><span class="dot"></span>${v.good ? 'Got it' : 'Not yet'}${!v.good && v.reasons.length && cur.override === null ? ' · ' + esc(v.reasons.join(', ')) : ''}${cur.override !== null ? ' (your call)' : ''}</div>
    <div class="actions">
      ${!(cur.zh && cur.zh.gave) ? `<button class="btn" id="retry">Try again</button>` : ''}
      <button class="btn" id="flip">${v.good ? 'Count as wrong' : 'Count as right'}</button>
      <button class="btn primary" id="next">Next <span class="kbd">Enter</span></button>
    </div>`;
  $('#stage').appendChild(box);
  $('#flip').onclick = () => { cur.override = !v.good; renderResult(); };
  const rt = $('#retry'); if (rt) rt.onclick = () => { cur.zh = null; cur.en = null; cur.override = null; stepMandarin(); };
  $('#next').onclick = nextCard;
  $('#next').focus();
}

function nextCard() {
  const cur = S.cur, v = verdictOf(cur);
  srsUpdate(cur.it.id, v.good);
  S.done++; if (v.good) S.right++; else {
    S.missed.push(cur.w);
    if (!S.requeued.has(cur.it.id)) { S.requeued.add(cur.it.id); S.q.splice(Math.min(S.q.length, S.pos + 5), 0, cur.it); }
  }
  if (cur.zh && cur.zh.rows) cur.zh.rows.forEach(r => { if (r.toneState === 'ok') { S.toneOk++; S.toneTot++; } else if (r.toneState === 'wrong') S.toneTot++; });
  S.pos++; showCard();
}

function summary() {
  const s = S || { done: 0, right: 0, toneOk: 0, toneTot: 0, missed: [] };
  const uniq = [...new Map(s.missed.map(w => [w[0], w])).values()];
  app.innerHTML = `
  <header><div class="eyebrow">Session done</div><h1>${s.done ? s.right + ' of ' + s.done + ' right' : 'No cards answered'}</h1></header>
  <section class="panel">
    <div class="stats">
      <div class="stat"><b>${s.done ? Math.round(s.right / s.done * 100) : 0}%</b><span>cards right</span></div>
      <div class="stat"><b>${s.toneTot ? Math.round(s.toneOk / s.toneTot * 100) + '%' : '—'}</b><span>tones right (${s.toneTot} graded)</span></div>
      <div class="stat"><b>${counts().due}</b><span>still due</span></div>
    </div>
    ${S && S.pitchOff ? `<div class="notice">Tone tracking couldn't run alongside speech recognition on this device, so tones weren't graded. It works in Chrome on a laptop or desktop.</div>` : ''}
  </section>
  ${uniq.length ? `<section class="panel"><h2>To practise</h2><ul class="missed">${uniq.map(w => `<li><span class="h" lang="zh-CN">${coloredHan(w)}</span><span>${coloredPinyin(w)}</span><span class="muted small">${esc(w[3][0])}</span></li>`).join('')}</ul></section>` : ''}
  <div class="actions"><button class="btn" id="home">Home</button><button class="btn primary" id="more" ${counts().due + Math.min(counts().fresh, SET.fresh) ? '' : 'disabled'}>Another session</button></div>`;
  S = null;
  $('#home').onclick = home;
  $('#more').onclick = startSession;
}

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { const m = $('#mic'); if (m) { e.preventDefault(); m.click(); } }
  else if (e.key === 'Enter') { const n = $('#next'); if (n && document.activeElement !== n) { e.preventDefault(); n.click(); } }
});

home();
</script>
